# PSells as a stack: nginx in front, the web server behind it, and a
# PostgreSQL database beside that.
#
#     docker compose up --build -d --wait
#
# Values come from .env beside this file, which Compose reads on its own and
# which is gitignored; .env.example lists what it must hold. Every value is
# written as ${NAME:?...}, so a missing one stops Compose with that sentence
# instead of starting a database with an empty password.
#
# The terminal application runs inside the app container, against the same
# database and settings as the web server:
#     docker compose exec app python psells.py

# Fixes the prefix Docker gives the volume and network, so they are
# psells_pgdata and psells_default whatever this folder happens to be called.
name: psells

services:
  proxy:
    # The only service the outside world can reach. It passes every request to
    # the app over this stack's network; see nginx/nginx.conf. The Docker
    # Official Image, stable line, on Alpine, pinned like every other image.
    # The Lint workflow runs nginx -t with the same image, and a test holds the
    # two equal, because Dependabot does not update an image in a workflow.
    image: nginx:1.30.5-alpine@sha256:bf3201ab56f23e5954646379c775d511fc466e9f11376d9725361064ad07ed35
    # The image's own nginx user and group (101), never root, as the app runs
    # as psells. nginx/nginx.conf is written for this: port 8080, and its
    # process id and temporary files in /tmp.
    user: "101:101"
    ports:
      # 127.0.0.1 only. There is no authentication, and without this prefix
      # anyone on the same network could read and change every record.
      # HTTPS on 443, so the address is https://psells.localhost with no port;
      # 80 only redirects to it. Inside, nginx listens above 1024 on 8443 and
      # 8080, because it does not run as root.
      - "127.0.0.1:443:8443"
      - "127.0.0.1:80:8080"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      # The certificate and its key, from make-certificate.sh. data/ is
      # ignored by git and by the Docker build, so the key reaches neither.
      # Run make-certificate.sh before the first "up", or nginx stops at
      # startup saying it cannot find them.
      - "./data/tls:/etc/nginx/tls:ro"
    networks:
      default:
        # Fixed, because the app believes X-Forwarded-Proto and
        # X-Forwarded-For from this one address and no other. It must match
        # FORWARDED_ALLOW_IPS below, and sit outside ip_range at the bottom of
        # this file, which is where Docker hands out addresses of its own.
        ipv4_address: "${PSELLS_NETWORK:-10.213.47}.10"
    depends_on:
      app:
        condition: service_healthy
        # nginx looks up the app's address once, when it starts. Recreating
        # the app, as "up --build" does after a code change, can give it a new
        # one; this restarts nginx after it, so nginx never keeps the old.
        restart: true
    healthcheck:
      # nginx's own answer on its private health port, not the app's: see the
      # first server in nginx/nginx.conf. wget because Alpine ships it and has
      # no curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  app:
    build: .
    # No ports. Only nginx reaches the app, over this stack's network, so every
    # request passes through nginx/nginx.conf first.
    environment:
      # Assembled from the same values the database is created with, so the
      # password is written once, in .env. "db" is the database service's
      # name, which Compose's network resolves to its container.
      PSELLS_DATABASE_URL: "postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}"
      PSELLS_CONFIG: /config/config.json
      # uvicorn reads X-Forwarded-Proto (http or https) and X-Forwarded-For
      # (the client's address) from these addresses only, and from anyone else
      # ignores them. nginx's one address, nothing wider: whoever this names
      # can tell the app a request arrived over HTTPS.
      FORWARDED_ALLOW_IPS: "${PSELLS_NETWORK:-10.213.47}.10"
    volumes:
      # The one file the application reads from disk, the default partner
      # percentage, mounted read-only: the container can read the rate and
      # cannot change it, and sees nothing else from the folder it lives in.
      # Required, never defaulted, so the file in use is always a choice.
      - "${PSELLS_CONFIG_FILE:?set PSELLS_CONFIG_FILE in .env}:/config/config.json:ro"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy once uvicorn accepts connections. Docker accepts a connection on
      # the published port before the app inside is listening and then drops
      # it, so a request made the moment the container starts gets an empty
      # reply. "docker compose up --wait" waits for this instead. It opens a
      # socket rather than requesting a page, so it adds nothing to the log.
      # Python rather than curl, because the slim image has no curl.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  db:
    # An exact version and the digest of its contents, so every machine runs
    # the same bytes. Dependabot proposes updates; db-test and CI must match.
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in .env}"
    volumes:
      # From version 18 the image keeps its data in a versioned folder under
      # /var/lib/postgresql, and the volume goes on that parent. Mounting it at
      # /var/lib/postgresql/data, as every guide for 17 and earlier says, is
      # refused at startup.
      - "pgdata:/var/lib/postgresql"
      # Run once by the image, the first time the volume is created, and never
      # again: it builds the empty tables. Read-only, like every file this
      # stack mounts.
      - "./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"
    # No ports, deliberately. Only the app reaches the database, over the
    # network Compose creates for this stack. A SQL prompt is:
    #     docker compose exec db psql -U <user> <database>
    healthcheck:
      # $$ passes a literal $ through Compose, so the variables are read inside
      # the container rather than substituted from .env when the file is read.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  db-test:
    # The database the test suite runs against. It holds invented rows only
    # and forgets them when it stops, so its password is written here in the
    # open and means nothing. It shares nothing with db: not its data, not its
    # password, not its network port. Started only when asked for:
    #     docker compose --profile test up -d --wait db-test
    profiles: ["test"]
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_USER: psells_test
      POSTGRES_PASSWORD: psells_test
      POSTGRES_DB: psells_test
    # Memory rather than disk: nothing a test writes survives the container,
    # and nothing waits on a disk.
    tmpfs:
      - /var/lib/postgresql
    ports:
      # pytest runs on the Mac, outside the stack, so this one port is
      # published, to this machine only. 5433 so it cannot be mistaken for, or
      # collide with, a PostgreSQL on its usual 5432.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psells_test -d psells_test"]
      interval: 2s
      timeout: 5s
      retries: 15

networks:
  # The network Compose creates for this stack, with a fixed range so nginx can
  # have a fixed address. 10.213.47 is private and chosen to be unlikely to
  # clash with a home network or a VPN; if one ever does, PSELLS_NETWORK in
  # .env moves the whole stack to another range. The sample stack in the
  # README sets it on the command line, because two stacks cannot share a
  # range and the real one keeps its network while it is stopped.
  default:
    ipam:
      config:
        - subnet: "${PSELLS_NETWORK:-10.213.47}.0/24"
          # Docker's own choices come from the top half, .128 to .255, so no
          # container it starts can take the address given to nginx.
          ip_range: "${PSELLS_NETWORK:-10.213.47}.128/25"

volumes:
  # The database lives here, inside Docker Desktop's disk, not in this folder.
  # "docker compose down -v" deletes it, and so does resetting Docker Desktop.
  # Plain "docker compose down" keeps it.
  pgdata:
