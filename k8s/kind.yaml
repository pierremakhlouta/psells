# A local Kubernetes cluster for PSells, made by kind (Kubernetes in Docker):
#
#     kind create cluster --config k8s/kind.yaml
#     kind delete cluster --name psells
#
# It runs the invented sample records only, never the real ones, which stay in
# the Compose stack; see k8s/up.sh, which also loads the cluster's secrets and
# applies the manifests.
#
# One node, which is both control plane and worker: the cluster exists to run
# one application, not to show scheduling across machines.
#
# The node image is pinned by digest: the release notes of kind v0.33.0 list it
# as the default for that release, and docker buildx imagetools inspect agreed
# on 7 October 2026. A tag alone could be moved to other bytes.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: psells
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # HTTPS reaches nginx through the node's port 30443, the Service in
    # k8s/app.yaml. On the Mac it is 127.0.0.1:9443 only, as the Compose stack
    # publishes on 127.0.0.1 only, and 9443 so it never collides with the real
    # stack on 443. No plain HTTP port at all.
    extraPortMappings:
      - containerPort: 30443
        hostPort: 9443
        listenAddress: "127.0.0.1"
        protocol: TCP
