# PostgreSQL for the cluster: the invented sample records only, never the real
# ones, which stay in the Compose stack on the Mac.
#
# A StatefulSet of one, so the database keeps its own volume across restarts
# and is the same pod by name each time; a Deployment would treat it as
# interchangeable. The same image as compose.yaml's db, pinned by digest, and
# a test holds the two equal.
#
# The first start of an empty volume runs the two files of the database-init
# ConfigMap, made by kustomization.yaml from schema.sql and
# sample_data/seed.sql where they are, in order: the tables, then the sample
# records. After that the volume has data and they are never run again, as in
# Compose.
#
# The password is the psells-db Secret, which k8s/up.sh generates when it
# creates the cluster; it is written nowhere else.

apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  # A fixed name, db, as in Compose, so the app reaches it the same way. No
  # cluster address of its own: one database, reached by name.
  clusterIP: None
  selector:
    app.kubernetes.io/name: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database
    spec:
      # The image's postgres user, never root; the volume belongs to its
      # group, so initdb can write to it.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: psells
            - name: POSTGRES_DB
              value: psells
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: psells-db
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Ready only when PostgreSQL accepts connections, as Compose's health
          # check does; restarted if it stops answering for half a minute.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U psells -d psells"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U psells -d psells"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # Where PostgreSQL keeps its socket and lock file: writable,
            # since the rest of the container is read-only.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: init
          configMap:
            name: database-init
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
