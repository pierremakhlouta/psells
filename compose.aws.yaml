# What differs on the AWS server, laid over compose.yaml. Used there only:
#
#     docker compose -f compose.yaml -f compose.aws.yaml up -d --wait
#
# The Mac never reads this file. Compose merges it into compose.yaml: a
# volume here replaces the one in compose.yaml with the same path inside the
# container, a new one is added, !override replaces a list outright where
# Compose would otherwise add the two lists together, and !reset removes a
# setting altogether.
#
# The server holds the invented sample data only, never the real records.

services:
  app:
    # The image CI built, scanned and published to GHCR, by digest, so the
    # server runs exactly what was scanned and builds nothing. deploy.sh
    # resolves the digest for the commit it deploys and writes it into .env.
    image: "${PSELLS_IMAGE:?set PSELLS_IMAGE in .env; deploy/aws/deploy.sh writes it}"
    build: !reset null
    volumes:
      # AWS's certificate authorities for RDS in this region, which deploy.sh
      # fetches on every deploy. With RDS switched on, the app checks RDS's
      # certificate against them (sslmode=verify-full), so it cannot be
      # talking to anything but RDS. Unused while RDS is off.
      - "./data/rds-ca.pem:/config/rds-ca.pem:ro"

  proxy:
    # On every address, because this server is public: its security group
    # lets in 80 and 443 and nothing else. compose.yaml publishes on
    # 127.0.0.1 only, which on the server would reach no one.
    ports: !override
      - "443:8443"
      - "80:8080"
      # For the load balancer, when infra/aws switches it on. The server's
      # security group lets this port in from the load balancer alone; with
      # the switch off nothing may reach it.
      - "8090:8090"
    volumes:
      # The server's name and its certificate's paths, in place of the Mac's.
      - "./nginx/sites/aws:/etc/nginx/site:ro"
      # Let's Encrypt's certificate, written by the certbot service below, in
      # place of the Mac's own CA.
      - "./data/letsencrypt:/etc/nginx/tls:ro"
      # The files Let's Encrypt fetches over plain HTTP to prove the name,
      # which certbot leaves here; see nginx/sites/aws/http.conf.
      - "./data/acme:/var/www/acme:ro"
    # To the system journal rather than Docker's own files, so the monitoring
    # agent below can read nginx's access log without Docker's API. The
    # journal rotates itself, and docker compose logs still reads it.
    logging:
      driver: journald

  alloy:
    # The monitoring agent; see monitoring/config.alloy for what it sends to
    # Grafana Cloud and why. On the server only: the Mac's records never leave
    # the Mac, so compose.yaml has no such service. Pinned like every other
    # image; checked with docker buildx imagetools inspect on 4 October 2026
    # against the v1.20.1 release.
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    # Not root: the image's own alloy user, which owns its data folder, with
    # the host's systemd-journal group (999 on Ubuntu) added so it can read
    # the journal and nothing more. No Docker socket.
    user: "473:473"
    group_add: ["999"]
    command: ["run", "/etc/alloy/config.alloy",
              "--storage.path=/var/lib/alloy/data",
              # It tells Grafana nothing about which components it runs, and
              # serves no profiling endpoint.
              "--disable-reporting",
              "--server.http.enable-pprof=false"]
    environment:
      GRAFANA_METRICS_URL: "${GRAFANA_METRICS_URL:?deploy/aws/deploy.sh writes it from /psells/grafana}"
      GRAFANA_METRICS_USER: "${GRAFANA_METRICS_USER:?deploy/aws/deploy.sh writes it from /psells/grafana}"
      GRAFANA_LOGS_URL: "${GRAFANA_LOGS_URL:?deploy/aws/deploy.sh writes it from /psells/grafana}"
      GRAFANA_LOGS_USER: "${GRAFANA_LOGS_USER:?deploy/aws/deploy.sh writes it from /psells/grafana}"
      GRAFANA_TOKEN: "${GRAFANA_TOKEN:?deploy/aws/deploy.sh writes it from /psells/grafana}"
      # Go's collector works to stay under this, below the container's limit.
      GOMEMLIMIT: "96MiB"
    volumes:
      - "./monitoring/config.alloy:/etc/alloy/config.alloy:ro"
      # Where it keeps metrics and its place in the journal while it cannot
      # send, so a restart or a short outage loses nothing.
      - "alloy-data:/var/lib/alloy/data"
      # The server's health, read-only. The whole disk is mounted only so
      # its free space can be measured; as user 473 the agent can read only
      # what everyone may, not .env, the certificate's key or the database.
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/host/root:ro,rslave"
      - "/var/log/journal:/var/log/journal:ro"
      - "/etc/machine-id:/etc/machine-id:ro"
      # The disk's name and model for the disk activity figures; without it
      # the agent logs an error at every start.
      - "/run/udev/data:/run/udev/data:ro"
    # Nothing to write but its data folder and /tmp, no privileges to gain,
    # and a ceiling on memory, so on a 1 GiB server it can never starve the
    # app or the database: past the limit the kernel stops it, not them.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 160m
    restart: unless-stopped

  certbot:
    # Gets and renews the certificate. Runs only when asked for:
    #     docker compose -f compose.yaml -f compose.aws.yaml run --rm certbot renew
    # Pinned like every other image; checked with docker buildx imagetools
    # inspect on 27 September 2026 against the v5.8.0 release.
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    profiles: ["certbot"]
    # nginx's own user. certbot needs no root for a webroot, and the key it
    # writes, readable by its owner only, then belongs to the one user that
    # reads it. Both folders below must belong to 101 on the server.
    user: "101:101"
    # certbot's working and log folders default to places only root may write;
    # these go in the container and are thrown away with it.
    entrypoint: ["certbot", "--work-dir", "/tmp/certbot/work",
                 "--logs-dir", "/tmp/certbot/logs"]
    volumes:
      - "./data/letsencrypt:/etc/letsencrypt"
      - "./data/acme:/var/www/acme"
    # Not on the stack's network: it talks to Let's Encrypt, not to the app.
    network_mode: bridge

volumes:
  alloy-data:
