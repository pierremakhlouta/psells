# Dependabot: tells PSells when a pinned version has aged.
#
# Every dependency in requirements.txt and requirements-dev.txt is pinned to an
# exact version, every action in the workflows to a commit, and every base
# image to a version and digest. Pins make a build
# repeatable and say nothing when a newer release fixes a bug or a
# vulnerability. pip-audit, in security.yml, catches known vulnerabilities; this
# catches age. Once a month Dependabot checks for newer versions and opens a
# pull request raising the pin, and the workflows run against that branch like
# any other push, so a bump that breaks something arrives already red.
#
# Patch releases only, since 22 October 2026, when PSells went into
# maintenance: a new minor or major version (Python 3.15, nginx's mainline
# 1.31, a FastAPI 0.x minor) is a change to make on purpose, not a pull
# request to merge. A security fix that needs one still arrives: the weekly
# scans in security.yml and image.yml fail on any flaw with a fix and email.
#
# Grouped, so a month's updates arrive as one pull request per ecosystem rather
# than one per package. Its pull requests, and any commit made by merging one,
# appear on the repository under the name dependabot[bot]; that was decided
# knowingly at the start of Phase 03b.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      actions:
        patterns: ["*"]

  # The base image in the Dockerfile, and the postgres image in compose.yaml.
  # Each pull request raises the version and the digest together, and
  # image.yml scans the result. The postgres service in tests.yml is not
  # covered by Dependabot; a test keeps it equal to compose.yaml.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      images:
        patterns: ["*"]

  # nginx/Dockerfile's FROM line: PSells' nginx image is built on it.
  - package-ecosystem: "docker"
    directory: "/nginx"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      nginx:
        patterns: ["*"]

  # analytics/Dockerfile's FROM line, the analytics image's base. A test holds
  # it equal to the app's, so the two pull requests are merged together.
  - package-ecosystem: "docker"
    directory: "/analytics"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      analytics:
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      compose:
        patterns: ["*"]
