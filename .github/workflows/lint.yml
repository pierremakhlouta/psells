name: Lint

on:
  push:

# Read-only. No job here writes to the repository, so none is given a token
# that could; if an action were ever compromised, as trivy-action was in March
# 2026, there would be nothing to steal but read access.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # shellcheck is already installed on the ubuntu runner image, so there is
      # nothing to set up. Every tracked .sh file is checked rather than a named
      # one, so a script added later is covered without anybody remembering to
      # come back here. Default severity only: the optional checks are style
      # opinions, and new ones arrive in new shellcheck releases, which would
      # fail a build on a script nobody touched.
      - name: Check every shell script in the repository
        run: git ls-files '*.sh' | xargs --no-run-if-empty shellcheck

  nginx:
    runs-on: ubuntu-latest

    # The image compose.yaml runs nginx from. Dependabot updates compose.yaml
    # but not this line, so test_container.py fails if the two ever differ.
    env:
      NGINX_IMAGE: nginx:1.30.5-alpine-slim@sha256:32463212baf0e7d91aded2e9b843a4f2b9e017804b8c9d5bae7b51dcef64389c

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # nginx -t loads the certificate and key it names, so it needs a pair.
      # This one is made by the same script, in a folder of the runner's own,
      # and thrown away with the runner. Its key is made readable by everyone
      # because nginx reads it as user 101, not as the runner's user; the real
      # key on the Mac stays readable by its owner only.
      - name: Make a throwaway certificate
        run: |
          PSELLS_CA_DIR="$RUNNER_TEMP/ca" PSELLS_TLS_DIR="$RUNNER_TEMP/tls" ./make-certificate.sh
          chmod a+rx "$RUNNER_TEMP/tls"
          chmod a+r "$RUNNER_TEMP/tls"/*

      # nginx -t reads the whole configuration and stops at the first line it
      # would refuse, without serving anything. It runs as nginx's own user
      # and with every file mounted read-only, as in the stack. It also looks
      # up every name in a proxy_pass, and "app" exists only inside the stack,
      # so --add-host stands it in.
      - name: Check the nginx configuration
        run: >-
          docker run --rm --user 101:101 --add-host app:127.0.0.1
          --volume "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          --volume "$PWD/nginx/snippets:/etc/nginx/snippets:ro"
          --volume "$PWD/nginx/sites/localhost:/etc/nginx/site:ro"
          --volume "$RUNNER_TEMP/tls:/etc/nginx/tls:ro"
          "$NGINX_IMAGE" nginx -t

      # The same configuration with the AWS server's site, which reads its
      # certificate where certbot keeps it. The throwaway pair stands in for
      # Let's Encrypt's; nginx -t does not check the name on it.
      - name: Check the nginx configuration with the server's site
        run: |
          live="$RUNNER_TEMP/letsencrypt/live/psells.lakeshorefreight.me"
          mkdir -p "$live" "$RUNNER_TEMP/acme"
          cp "$RUNNER_TEMP/tls/psells.localhost.crt" "$live/fullchain.pem"
          cp "$RUNNER_TEMP/tls/psells.localhost.key" "$live/privkey.pem"
          chmod -R a+rX "$RUNNER_TEMP/letsencrypt"
          docker run --rm --user 101:101 --add-host app:127.0.0.1 \
            --volume "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --volume "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            --volume "$PWD/nginx/sites/aws:/etc/nginx/site:ro" \
            --volume "$RUNNER_TEMP/letsencrypt:/etc/nginx/tls:ro" \
            --volume "$RUNNER_TEMP/acme:/var/www/acme:ro" \
            "$NGINX_IMAGE" nginx -t

  terraform:
    runs-on: ubuntu-latest

    # The Terraform release the configurations are written for, pinned by
    # digest. Dependabot does not update an image named in a workflow, so
    # test_infra.py holds it to the version required_version allows.
    env:
      TERRAFORM_IMAGE: hashicorp/terraform:1.16.4@sha256:985cdc6c1d9b0a65b83377f666efd2f740b47f02ac55be1ced3d18f7d3b0e829

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Formatting, in every configuration.
      - name: Check the Terraform formatting
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo:ro"
          --workdir /repo/infra "$TERRAFORM_IMAGE" fmt -check -recursive -diff

      # Each configuration parses, names attributes that exist, and fits the
      # provider its lock file pins. No AWS account is reached: -backend=false
      # skips the state bucket, and validate reads nothing from AWS. The copy
      # is writable because init downloads the provider into it, and it is the
      # whole repository, because the server's user data is read from
      # deploy/aws/, outside infra/.
      - name: Validate each Terraform configuration
        run: |
          cp -r "$PWD" "$RUNNER_TEMP/repo"
          for dir in infra/aws infra/aws/bootstrap infra/grafana; do
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$RUNNER_TEMP/repo:/repo" --workdir "/repo/$dir" \
              "$TERRAFORM_IMAGE" init -backend=false -input=false -lockfile=readonly
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$RUNNER_TEMP/repo:/repo" --workdir "/repo/$dir" \
              "$TERRAFORM_IMAGE" validate
          done
