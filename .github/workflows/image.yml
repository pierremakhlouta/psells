name: Image

# Builds the application's image, scans it for known vulnerabilities, and on
# main publishes it to GitHub's container registry, where the AWS server pulls
# it from. What is published is the image that was scanned, not a rebuild.
# The scan covers the Debian packages in the base image and the Python
# packages installed on top; pip-audit in security.yml covers the requirements
# files. The nginx image in front of it is scanned the same way, in a job of
# its own, so each reports its own result.
#
# On every push, and weekly, because vulnerabilities are found in packages
# that have not changed. Only a push to main publishes.

on:
  push:
  schedule:
    - cron: "0 9 * * 1"

# Read-only unless a job says otherwise. Only the publish job, which runs on
# main alone and runs no third-party action, may write packages. The scanner
# runs in a read-only job: if an action were ever compromised, as trivy-action
# was in March 2026, its token could publish nothing.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/pierremakhlouta/psells

jobs:
  app:
    # Built natively on each architecture: amd64 for anyone's laptop and CI,
    # arm64 for the AWS server. GitHub's arm64 runners are free for public
    # repositories. Each build is scanned where it is built.
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Labelled with the repository, so GHCR ties the package to it, and with
      # the commit it was built from. Its ID, the digest of its contents, is
      # recorded so the publish job can prove it pushes this image.
      - name: Build the image
        run: |
          docker build --tag psells:ci \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            .
          docker image inspect --format '{{.Id}}' psells:ci > image-id

      # Two runs of the same scanner, because they answer different questions.
      # The first lists everything and never fails, so an unfixable
      # vulnerability in the base image is still seen. The second fails the
      # build only on a high or critical one that has a fixed version, which
      # is one PSells can act on.
      - name: List every known vulnerability
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: psells:ci
          fail-build: false
          output-format: table
          output-file: grype-all.txt

      - name: Show the list
        run: cat grype-all.txt

      - name: Fail on a high or critical vulnerability that has a fix
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: psells:ci
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
          output-file: grype-fixable.txt

      - name: Show what failed the build
        if: failure()
        run: cat grype-fixable.txt

      # On main, the scanned image and its ID are handed to the publish job,
      # which alone may write to the registry. Kept a day: only that job reads
      # them.
      - name: Save the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save psells:ci | gzip > image.tar.gz

      - name: Hand the scanned image to the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: |
            image.tar.gz
            image-id
          retention-days: 1

  publish:
    # Pushes both scanned images, then one name for both architectures: the
    # commit's tag points at an index listing the two, and a machine pulls
    # the one for itself. Only GitHub's own artifact action and the docker
    # command run here, since this job's token can write packages.
    needs: app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      packages: write

    steps:
      - name: Take the scanned images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: image-*

      # Each loaded image must have the ID recorded where it was scanned, or
      # it is not the image that was scanned, and nothing is pushed.
      - name: Publish the scanned images under the commit's tag
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          for arch in amd64 arm64; do
            loaded=$(gunzip -c "image-$arch/image.tar.gz" | docker load --quiet | sed -n 's/^Loaded image ID: //p;s/^Loaded image: //p')
            id=$(docker image inspect --format '{{.Id}}' "$loaded")
            scanned=$(cat "image-$arch/image-id")
            [ "$id" = "$scanned" ] || { echo "image-$arch is $id, but $scanned was scanned"; exit 1; }
            docker tag "$id" "$IMAGE:${{ github.sha }}-$arch"
            docker push --quiet "$IMAGE:${{ github.sha }}-$arch"
          done
          docker buildx imagetools create --tag "$IMAGE:${{ github.sha }}" \
            "$IMAGE:${{ github.sha }}-amd64" "$IMAGE:${{ github.sha }}-arm64"
          docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"
          docker logout ghcr.io

  nginx:
    runs-on: ubuntu-latest

    # The nginx image compose.yaml runs, scanned the same two ways as the app's
    # image. It is not built here, only pulled, but it is as much a part of
    # what serves PSells. Dependabot updates compose.yaml and not this line,
    # so test_container.py fails if the two ever differ.
    env:
      NGINX_IMAGE: nginx:1.30.5-alpine-slim@sha256:32463212baf0e7d91aded2e9b843a4f2b9e017804b8c9d5bae7b51dcef64389c

    steps:
      # Pulled by its digest first, so the scan reads exactly these bytes
      # from the local Docker rather than looking the name up itself.
      - name: Pull the image
        run: docker pull "$NGINX_IMAGE"

      - name: List every known vulnerability
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ env.NGINX_IMAGE }}
          fail-build: false
          output-format: table
          output-file: grype-all.txt

      - name: Show the list
        run: cat grype-all.txt

      # Checked out for nginx/grype-exceptions.yaml only: the vulnerabilities
      # this job's failing scan skips, each with its reason. The file has an
      # expiry date, and once it has passed this job fails until someone looks
      # again, so an exception cannot quietly become permanent. The app job
      # reads no such file.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fail once the exceptions have expired
        run: |
          expires=$(sed -n 's/^# expires: //p' nginx/grype-exceptions.yaml)
          echo "Exceptions expire on $expires"
          test "$(date -u +%F)" '<' "$expires"

      - name: Fail on a high or critical vulnerability that has a fix
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ env.NGINX_IMAGE }}
          config: nginx/grype-exceptions.yaml
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
          output-file: grype-fixable.txt

      - name: Show what failed the build
        if: failure()
        run: cat grype-fixable.txt
