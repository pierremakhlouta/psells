name: Image

# Builds the application's image, scans it for known vulnerabilities, and on
# main publishes it to GitHub's container registry, where the AWS server pulls
# it from. What is published is the image that was scanned, not a rebuild.
# The scan covers the Debian packages in the base image and the Python
# packages installed on top; pip-audit in security.yml covers the requirements
# files. PSells' nginx image, built from nginx/Dockerfile, is built, scanned and
# published the same way and in the same jobs, tagged nginx-<commit> in the same
# package, so the server runs a scanned nginx too.
#
# On every push, and weekly, because vulnerabilities are found in packages
# that have not changed. Only a push to main publishes.

on:
  push:
  schedule:
    - cron: "0 9 * * 1"

# Read-only unless a job says otherwise. Only the publish job, which runs on
# main alone and runs no third-party action, may write packages. The scanner
# runs in a read-only job: if an action were ever compromised, as trivy-action
# was in March 2026, its token could publish nothing.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/pierremakhlouta/psells

jobs:
  app:
    # Built natively on each architecture: amd64 for anyone's laptop and CI,
    # arm64 for the AWS server and the Mac's cluster. GitHub's arm64 runners
    # are free for public repositories. Each build is scanned where it is
    # built. Two images: the app's, from the Dockerfile at the top, and
    # nginx's, from nginx/Dockerfile, each built and scanned the same way.
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            image: app
            context: .
          - runner: ubuntu-24.04-arm
            arch: arm64
            image: app
            context: .
          - runner: ubuntu-24.04
            arch: amd64
            image: nginx
            context: nginx
          - runner: ubuntu-24.04-arm
            arch: arm64
            image: nginx
            context: nginx
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Labelled with the repository, so GHCR ties the package to it, and with
      # the commit it was built from. Its ID, the digest of its contents, is
      # recorded so the publish job can prove it pushes this image.
      - name: Build the image
        run: |
          docker build --tag psells:ci \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            ${{ matrix.context }}
          docker image inspect --format '{{.Id}}' psells:ci > image-id

      # Two runs of the same scanner, because they answer different questions.
      # The first lists everything and never fails, so an unfixable
      # vulnerability in the base image is still seen. The second fails the
      # build only on a high or critical one that has a fixed version, which
      # is one PSells can act on.
      - name: List every known vulnerability
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: psells:ci
          fail-build: false
          output-format: table
          output-file: grype-all.txt

      - name: Show the list
        run: cat grype-all.txt

      - name: Fail on a high or critical vulnerability that has a fix
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: psells:ci
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
          output-file: grype-fixable.txt

      - name: Show what failed the build
        if: failure()
        run: cat grype-fixable.txt

      # On main, the scanned image and its ID are handed to the publish job,
      # which alone may write to the registry. Kept a day: only that job reads
      # them.
      - name: Save the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save psells:ci | gzip > image.tar.gz

      - name: Hand the scanned image to the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            image.tar.gz
            image-id
          retention-days: 1

  publish:
    # Pushes both scanned images, then one name for both architectures: the
    # commit's tag points at an index listing the two, and a machine pulls
    # the one for itself. Only GitHub's own artifact action and the docker
    # command run here, since this job's token can write packages.
    needs: app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      packages: write

    steps:
      - name: Take the scanned images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: image-*

      # Each loaded image must have the ID recorded where it was scanned, or
      # it is not the image that was scanned, and nothing is pushed.
      - name: Publish the scanned images under the commit's tag
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          # The app under the commit's own tag, as the server has always pulled
          # it, and nginx under nginx-<commit> in the same package.
          for image in app nginx; do
            prefix=""
            [ "$image" = nginx ] && prefix="nginx-"
            for arch in amd64 arm64; do
              folder="image-$image-$arch"
              loaded=$(gunzip -c "$folder/image.tar.gz" | docker load --quiet | sed -n 's/^Loaded image ID: //p;s/^Loaded image: //p')
              id=$(docker image inspect --format '{{.Id}}' "$loaded")
              scanned=$(cat "$folder/image-id")
              [ "$id" = "$scanned" ] || { echo "$folder is $id, but $scanned was scanned"; exit 1; }
              docker tag "$id" "$IMAGE:${prefix}${{ github.sha }}-$arch"
              docker push --quiet "$IMAGE:${prefix}${{ github.sha }}-$arch"
            done
            docker buildx imagetools create --tag "$IMAGE:${prefix}${{ github.sha }}" \
              "$IMAGE:${prefix}${{ github.sha }}-amd64" "$IMAGE:${prefix}${{ github.sha }}-arm64"
            docker buildx imagetools inspect "$IMAGE:${prefix}${{ github.sha }}"
          done
          docker logout ghcr.io

  alloy:
    runs-on: ubuntu-latest

    # The monitoring agent compose.aws.yaml runs on the AWS server, scanned
    # the same two ways as nginx's image. Not built here, only pulled. No
    # Dependabot watches compose.aws.yaml, so test_container.py fails if this
    # line and that file ever differ.
    env:
      ALLOY_IMAGE: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f

    steps:
      - name: Pull the image
        run: docker pull "$ALLOY_IMAGE"

      - name: List every known vulnerability
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ env.ALLOY_IMAGE }}
          fail-build: false
          output-format: table
          output-file: grype-all.txt

      - name: Show the list
        run: cat grype-all.txt

      # For monitoring/grype-exceptions.yaml: the one image with an exception,
      # because it is not PSells' to rebuild.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fail once the exceptions have expired
        run: |
          expires=$(sed -n 's/^# expires: //p' monitoring/grype-exceptions.yaml)
          echo "Exceptions expire on $expires"
          test "$(date -u +%F)" '<' "$expires"

      # The OpenSSL exception rests on this: the agent never loads libssl.
      - name: Fail if the agent links OpenSSL
        run: |
          libraries=$(docker run --rm --entrypoint ldd "$ALLOY_IMAGE" /bin/alloy)
          echo "$libraries"
          ! grep -q libssl <<< "$libraries"

      - name: Fail on a high or critical vulnerability that has a fix
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ env.ALLOY_IMAGE }}
          config: monitoring/grype-exceptions.yaml
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
          output-file: grype-fixable.txt

      - name: Show what failed the build
        if: failure()
        run: cat grype-fixable.txt
