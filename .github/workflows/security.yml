name: Security

on:
  push:
  schedule:
    - cron: "0 9 * * 1"

# Read-only. No job here writes to the repository, so none is given a token
# that could; if an action were ever compromised, as trivy-action was in March
# 2026, there would be nothing to steal but read access.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt --requirement requirements-dev.txt
  secrets:
    runs-on: ubuntu-latest

    # gitleaks, pinned by digest like every other image. Dependabot does not
    # update an image named in a workflow, so test_container.py holds it to a
    # version and a digest.
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

    steps:
      # Every commit, not only the latest: a secret committed and then removed
      # is still in the history anyone can clone.
      - name: Check out the repository with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Fails the job on anything that looks like a credential, in any commit
      # on any branch. --redact keeps what it finds out of the log. It runs as
      # the runner's own user, who owns the checkout: git refuses to read a
      # repository another user owns, and the scan would then read nothing.
      - name: Scan the history for secrets
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --volume "$PWD:/repo:ro" "$GITLEAKS_IMAGE"
          git /repo --log-opts=--all --redact --no-banner
