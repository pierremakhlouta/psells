name: Tests

on:
  push:

# Read-only. No job here writes to the repository, so none is given a token
# that could; if an action were ever compromised, as trivy-action was in March
# 2026, there would be nothing to steal but read access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The throwaway PostgreSQL the suite runs against, the same image and the
    # same invented credentials as the db-test service in compose.yaml, on the
    # same port, so the tests find it at the address they use on a laptop.
    # The runner waits for the health check before the first step. Dependabot
    # does not update a service image, so test_container.py fails if this one
    # stops matching compose.yaml.
    services:
      postgres:
        image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_USER: psells_test
          POSTGRES_PASSWORD: psells_test
          POSTGRES_DB: psells_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U psells_test -d psells_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
