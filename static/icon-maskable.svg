<svg xmlns="http://www.w3.org/2000/svg" viewBox="158.5 47.5 760 760">
  <!-- The maskable icon: icon.svg's monogram with more room around it, so
       all of it sits inside the safe zone, the circle of radius 40% of the
       width that Android keeps whatever shape it crops to. The monogram's
       farthest corner is 289 from its middle; 40% of 760 is 304. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#fefefe"/>
  <image href="logo.png" x="0" y="0" width="1024" height="1024"/>
  <rect x="0" y="580" width="1024" height="444" fill="#fefefe"/>
</svg>
