# pytest settings for PSells.
#
# Every warning is an error, so a new deprecation fails the run the day it
# appears rather than scrolling past in the summary until the thing it warns
# about is removed. One warning is known and allowed: Starlette's test client
# still uses an anyio name that anyio has deprecated, and it shows on Python
# 3.14. It is matched on its full message, so any other warning from either
# library still fails. Remove the line once Starlette no longer triggers it.
[pytest]
filterwarnings =
    error
    ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead.:DeprecationWarning
