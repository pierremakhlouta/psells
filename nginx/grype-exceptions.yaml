# Vulnerabilities the nginx image's failing scan skips, in .github/workflows/
# image.yml's nginx job only. The app image has no exceptions. Each entry is as
# narrow as Grype allows: one CVE, one package, one version, so a newer
# vulnerable version or any other flaw still fails the scan. The listing step
# before it still prints everything.
#
# expires: 2026-10-31
#
# CVE-2026-103111, high, in pcre2 10.48-r0, fixed in 10.49-r0. Found 3 October
# 2026, when no nginx image had the fix: 1.30.5-alpine-slim (stable, pinned)
# and 1.31.6-alpine-slim (mainline) both carry 10.48-r0. nginx hands text to
# pcre2 only to evaluate the regular expressions in its configuration, and
# PSells' configuration has none (no regex location, map, rewrite or if);
# tests/test_container.py fails if one is added. Remove this entry, and update
# the nginx pin, once nginx publishes an image with pcre2 10.49 or later. From
# the date above the nginx job fails until this file is dealt with.
#
# CVE-2026-85091, high, in zlib 1.3.2-r0, fixed in 1.3.2-r1. Found 7 October
# 2026, in the same two images, which nginx had not rebuilt since 21 September,
# though Alpine 3.24 already has the fixed zlib (and pcre2 10.49). nginx calls
# zlib only to compress a response (gzip) or to decompress one (gunzip), and
# PSells' configuration turns neither on: gzip is off unless a directive says
# otherwise. tests/test_container.py fails if any gzip or gunzip directive is
# added. Both entries go once PSells builds its own nginx image with Alpine's
# fixed packages, planned next, or nginx publishes one.

ignore:
  - vulnerability: CVE-2026-103111
    package:
      name: pcre2
      version: 10.48-r0
      type: apk
  - vulnerability: CVE-2026-85091
    package:
      name: zlib
      version: 1.3.2-r0
      type: apk
