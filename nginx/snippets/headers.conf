# Headers on every response from PSells, errors included ("always"; without it
# nginx adds them to successful responses only). Included at server level by
# every server that passes requests to the app, so each carries the same four,
# written once. None goes in a location: nginx drops every add_header of a
# server from a location that has one of its own.

# Only HTTPS for the name, remembered for a year after one visit, so a browser
# never tries plain HTTP for it again. Not for other names under it, and not on
# any preload list. Sending max-age=0 over HTTPS undoes it.
add_header Strict-Transport-Security "max-age=31536000" always;

# What a page may load and do. PSells uses no scripts at all, and
# "default-src 'none'" forbids them along with everything else not named after
# it. The one style block in templates/base.html is allowed by the hash of its
# exact text, so an injected <style> or <script> is not; tests/test_container.py
# fails if the template's block and this hash drift apart. Forms may post only
# to PSells, no other site may show PSells in a frame, and <base> cannot move
# where relative links point.
add_header Content-Security-Policy "default-src 'none'; style-src 'sha256-jzAYgTJuTCViZgpTc7LI+fsz2E/e6JDYwLbR65VY3KY='; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

# The browser uses the content type it is given and never guesses one.
add_header X-Content-Type-Options "nosniff" always;

# Addresses within PSells are not sent to another site when a link leaves it.
add_header Referrer-Policy "same-origin" always;
