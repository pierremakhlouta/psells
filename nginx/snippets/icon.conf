# The icon an iPhone shows for PSells on its home screen. Safari asks for it
# by these two names, at the site's root, without a session, so nginx serves
# it itself, before the app's login: one file, static/apple-touch-icon.png,
# the PSells logo's monogram, mounted read-only at /srv/psells/static by
# compose.yaml and k8s/app.yaml. Nothing else is served this way. Included by
# every server that serves PSells, beside headers.conf.
location ~ ^/apple-touch-icon(-precomposed)?\.png$ {
    root /srv/psells/static;
    try_files /apple-touch-icon.png =404;
    # nginx.conf loads no table of types.
    types {
        image/png png;
    }
    # A week. expires sets its own headers, not add_header, so the server's
    # security headers still apply.
    expires 7d;
}
