# How a request is passed to the app. Included inside the catch-all location of
# every server that serves PSells, so each passes the same headers and counts
# the same login attempts, written once.

# Counts only what the map in nginx.conf keys: a POST to /login, by the
# visitor's address. nodelay answers the burst at once instead of spacing it
# out.
limit_req zone=login burst=5 nodelay;

# "app" is the app service's name, which Compose's network resolves to its
# container; 8000 is where uvicorn listens.
proxy_pass http://app:8000;

# The Host the browser sent, as it sent it. uvicorn takes the host from this
# header and never from X-Forwarded-Host, and the cross-site check compares it
# with the Origin header, port and all. $host would drop a port, which on any
# port but 443 would make every write from a browser that sends Origin without
# Sec-Fetch-Site look like it came from another site.
proxy_set_header Host $http_host;

# How the browser reached PSells: always HTTPS. Written out rather than taken
# from $scheme, because behind a load balancer TLS ends there and nginx itself
# is reached over plain HTTP inside the network; the browser still used HTTPS.
# uvicorn believes this from nginx's address only (FORWARDED_ALLOW_IPS in
# compose.yaml), and setting it here replaces anything the client sent.
proxy_set_header X-Forwarded-Proto https;

# Who connected, as nginx saw it. Set rather than appended to
# ($proxy_add_x_forwarded_for), so the client cannot choose the address the app
# records. Behind the load balancer, nginx's realip settings have already
# replaced $remote_addr with the visitor's address the load balancer reported.
proxy_set_header X-Forwarded-For $remote_addr;
