# The one address that takes photos. Every other request body is held to the
# 64k in nginx.conf; an upload here may carry what the site's
# photo-limit.conf allows: ten photos of 25 MB each on the Mac, three of 8 MB
# on the demo, which the app checks photo by photo (photos.py), plus the form
# around them.
# Included at server level, beside icon.conf, by every server that passes
# requests to the app. nginx keeps the body in client_body_temp_path until it
# has all of it, then passes it on.
location ~ ^/products/[0-9]+/photos$ {
    include /etc/nginx/site/photo-limit.conf;
    include /etc/nginx/snippets/app.conf;
}
