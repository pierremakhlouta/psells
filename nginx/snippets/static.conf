# The files a phone or a browser fetches to add PSells to a home screen or a
# Dock, and to show a page when it is offline: the manifest and the icons it
# names, the service worker, the script that registers it and the offline
# page. nginx serves them itself, before the app's login, because a phone
# fetches them without a session. Only these, by name: anything else under
# /static/, the icons' sources included, goes to the app like every other
# address. None holds a record or a figure. Included by every server that
# serves PSells, beside headers.conf.
#
# The folder is static/ in the repository, mounted read-only at
# /srv/psells/static by compose.yaml and by k8s/app.yaml.
location ~ ^/static/(apple-touch-icon\.png|icon-192\.png|icon-512\.png|icon-maskable-512\.png|manifest\.webmanifest|offline\.html|register\.js)$ {
    root /srv/psells;
    # nginx.conf loads no table of types, so the ones used here are named.
    types {
        image/png png;
        application/manifest+json webmanifest;
        text/html html;
        text/javascript js;
    }
    # A day, so a new icon reaches a phone by tomorrow. expires sets its own
    # headers, not add_header, so the server's security headers still apply.
    expires 1d;
}

# The service worker, at the site's root, since a worker controls only the
# pages at or below its own address. Never kept by the browser's own cache,
# so a new version is found on the next visit.
location = /sw.js {
    root /srv/psells/static;
    types {
        text/javascript js;
    }
    expires epoch;
}
