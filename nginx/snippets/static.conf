# The files a phone or a browser fetches to add PSells to a home screen or a
# Dock: the manifest and the icons it names. nginx serves them itself, before
# the app's login, because a phone fetches them without a session. Only
# these five, by name: anything else under /static/, the icons' sources
# included, goes to the app like every other address. Included by every
# server that serves PSells, beside headers.conf.
#
# The folder is static/ in the repository, mounted read-only at
# /srv/psells/static by compose.yaml and by k8s/app.yaml.
location ~ ^/static/(apple-touch-icon\.png|icon-192\.png|icon-512\.png|icon-maskable-512\.png|manifest\.webmanifest)$ {
    root /srv/psells;
    # nginx.conf loads no table of types, so the two used here are named.
    types {
        image/png png;
        application/manifest+json webmanifest;
    }
    # A day, so a new icon reaches a phone by tomorrow. expires sets its own
    # headers, not add_header, so the server's security headers still apply.
    expires 1d;
}
