# The one name PSells answers to on the AWS server, and its certificate.
# Included by the HTTPS server in nginx/nginx.conf; every other rule for that
# server is there, the same for every site.

server_name psells.lakeshorefreight.me;

# From Let's Encrypt, through the certbot service in compose.aws.yaml, which
# runs as nginx's own user, so the key belongs to the one user that reads it.
# compose.aws.yaml mounts certbot's folder here in place of data/tls.
ssl_certificate     /etc/nginx/tls/live/psells.lakeshorefreight.me/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/live/psells.lakeshorefreight.me/privkey.pem;
