# The listener the AWS Application Load Balancer sends requests to, while
# infra/aws's managed_services switch is on. TLS ends at the load balancer,
# with its own certificate for lb.psells.lakeshorefreight.me, and it forwards
# plain HTTP here inside the VPC. The server's security group lets this port in
# from the load balancer's security group only, never from the internet.

server {
    # Default for this port, because the load balancer's health check names
    # the target's address rather than a host. The load balancer's own rule
    # forwards only requests for its name.
    listen 8090 default_server;
    server_name lb.psells.lakeshorefreight.me;

    # The load balancer appends the visitor's address to X-Forwarded-For. It
    # is believed only from the VPC's private range, where the load balancer
    # is, and only the last address is taken, the one the load balancer added:
    # anything earlier came from the client and could say anything. With it,
    # the login limit and the app count visitors, not the load balancer.
    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;

    # The same headers and the same way to the app as the main server.
    include /etc/nginx/snippets/headers.conf;

    # What the load balancer's health check asks for. nginx answers it
    # itself, so it says nginx is up; the app's own health is the containers'.
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/snippets/app.conf;
    }
}
