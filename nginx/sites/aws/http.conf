# Plain HTTP on the AWS server. Included by the port 8080 server in
# nginx/nginx.conf. Let's Encrypt proves the name by fetching a file certbot
# leaves in the webroot, over plain HTTP on port 80, so those paths are
# answered here; everything else goes to the one HTTPS address. The target is
# written out in full rather than built from the Host the browser sent, so
# this can only ever redirect to PSells.

location /.well-known/acme-challenge/ {
    # compose.aws.yaml mounts certbot's webroot here, read-only.
    root /var/www/acme;
}

location / {
    return 301 https://psells.lakeshorefreight.me$request_uri;
}
