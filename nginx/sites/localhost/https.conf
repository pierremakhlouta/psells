# The one name PSells answers to on the Mac, and its certificate. Included by
# the HTTPS server in nginx/nginx.conf; every other rule for that server is
# there, the same for every site.

server_name psells.localhost;

# From make-certificate.sh, mounted read-only from data/tls/. The key never
# leaves this machine and is in no image.
ssl_certificate     /etc/nginx/tls/psells.localhost.crt;
ssl_certificate_key /etc/nginx/tls/psells.localhost.key;
