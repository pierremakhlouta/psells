# PSells for the Mac's other devices, through Tailscale. Included by
# nginx/nginx.conf on the Mac only.
#
# Tailscale's serve answers https://<this Mac>.<tailnet>.ts.net with its own
# Let's Encrypt certificate, to the devices of this tailnet alone, and passes
# each request here as plain HTTP on 127.0.0.1:8444, which compose.yaml
# publishes on the Mac's loopback only. It sends the browser's Host
# unchanged, so the app builds its links for the ts.net name, and nginx
# says the request came over HTTPS, as for every other server.
#
# Only a ts.net name is answered, by pattern, since the Mac's own name is
# private and stays out of this repository. Any other Host is refused with
# 421, as on 8443: that keeps DNS rebinding closed here too, since a hostile
# page cannot make a browser send a ts.net name to this port. One server per
# name pattern, the headers and the way to the app from the same snippets as
# the main server.
server {
    listen 8444;
    server_name ~^[a-z0-9-]+\.[a-z0-9-]+\.ts\.net$;

    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/icon.conf;

    location / {
        include /etc/nginx/snippets/app.conf;
    }
}

server {
    listen 8444 default_server;

    return 421;
}
