# nginx in front of PSells: the one service that publishes a port.
#
# Every request reaches nginx first and nginx passes it to the app container
# over the network Compose creates for this stack. The app publishes no port
# of its own, so this file decides what the outside world can send it.
#
# This replaces the image's own nginx.conf entirely, so everything nginx does
# is written here and nothing is inherited from files not in the repository.
# Mounted read-only by compose.yaml. tests/test_container.py reads it and holds
# the lines that matter in place, and the Lint workflow runs nginx -t on it with
# the same pinned image.

# nginx runs as the image's own unprivileged nginx user, set in compose.yaml,
# never as root. Three things follow from that. There is no "user" line here,
# because only a master process started as root can switch users. The process
# id file goes in /tmp, because /run belongs to root. And the temporary files
# below go in /tmp too, for the same reason.
pid /tmp/nginx.pid;

worker_processes auto;

# To the container's output, so docker compose logs shows them.
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    # Where nginx buffers a request or a reply too large to hold in memory. The
    # defaults are under /var/cache/nginx, which the nginx user cannot write.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;

    # For the container's health check only. It listens on the container's own
    # loopback, which nothing outside the container can reach, and on a port
    # compose.yaml does not publish, so the app's pages and this answer never
    # share an address. nginx answers it itself, so it says nginx is up and
    # nothing about the app. Not logged, or the log would fill with it.
    #
    # Not "allow 127.0.0.1; deny all;" in the main server: "return" runs
    # before nginx checks allow and deny, so a location that returns is
    # answered for everyone. That version was tried first and answered 200 to
    # an outside address.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    server {
        # Above 1024, because an ordinary user may not listen below it. The
        # outside port is chosen by compose.yaml, which forwards to this one.
        listen 8080;

        location / {
            # "app" is the app service's name, which Compose's network
            # resolves to its container; 8000 is where uvicorn listens.
            proxy_pass http://app:8000;

            # The Host the browser sent, port included. uvicorn takes the host
            # from this header and never from X-Forwarded-Host, and the
            # cross-site check compares it with the Origin header, which
            # carries the port. $host would drop the port, and every write
            # from a browser that sends Origin without Sec-Fetch-Site would
            # then be refused as coming from another site.
            proxy_set_header Host $http_host;

            # How the browser reached nginx. uvicorn believes this from nginx's
            # address only (FORWARDED_ALLOW_IPS in compose.yaml), and setting
            # it here replaces anything the client sent under the same name.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Who connected to nginx, as nginx saw it. Set rather than appended
            # to ($proxy_add_x_forwarded_for), because nginx is the first hop:
            # anything already in the header came from the client and would let
            # it choose the address the app records.
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
