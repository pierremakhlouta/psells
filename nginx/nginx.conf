# nginx in front of PSells: the one service that publishes ports, and where
# HTTPS ends.
#
# Every request reaches nginx first and nginx passes it to the app container
# over the network Compose creates for this stack. The app publishes no port
# of its own, so this file decides what the outside world can send it. HTTPS
# ends here: past nginx, requests travel as plain HTTP on that network, which
# nothing outside the stack can reach.
#
# This replaces the image's own nginx.conf entirely, so everything nginx does
# is written here and nothing is inherited from files not in the repository.
# Mounted read-only by compose.yaml. tests/test_container.py reads it and holds
# the lines that matter in place, and the Lint workflow runs nginx -t on it with
# the same pinned image.

# nginx runs as the image's own unprivileged nginx user, set in compose.yaml,
# never as root. Three things follow from that. There is no "user" line here,
# because only a master process started as root can switch users. The process
# id file goes in /tmp, because /run belongs to root. And the temporary files
# below go in /tmp too, for the same reason.
pid /tmp/nginx.pid;

worker_processes auto;

# To the container's output, so docker compose logs shows them.
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    # Where nginx buffers a request or a reply too large to hold in memory. The
    # defaults are under /var/cache/nginx, which the nginx user cannot write.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;

    # No version number in the Server header or on nginx's own error pages.
    # It helps nobody but someone matching a version to its known flaws.
    server_tokens off;

    # The largest request body nginx will pass on; anything bigger is answered
    # 413 without reaching the app. PSells' forms and its one JSON endpoint
    # send a few hundred bytes, and nginx's default is a megabyte.
    client_max_body_size 64k;

    # For the container's health check only. It listens on the container's own
    # loopback, which nothing outside the container can reach, and on a port
    # compose.yaml does not publish, so the app's pages and this answer never
    # share an address. nginx answers it itself, so it says nginx is up and
    # nothing about the app. Not logged, or the log would fill with it.
    #
    # Not "allow 127.0.0.1; deny all;" in the main server: "return" runs
    # before nginx checks allow and deny, so a location that returns is
    # answered for everyone. That version was tried first and answered 200 to
    # an outside address.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    # TLS 1.3 only. Every client is a current browser or curl on this machine,
    # and 1.3 removes the older ciphers and handshakes altogether. Set here,
    # for every server, because nginx settles the protocol before it knows
    # which server name the browser asked for.
    ssl_protocols TLSv1.3;

    # Plain HTTP, for any name at all: sent to the one HTTPS address with a
    # permanent redirect, and never passed to the app. The target is written
    # out in full rather than built from the Host the browser sent, so this
    # can only ever redirect to PSells.
    server {
        # Above 1024, because an ordinary user may not listen below it.
        # compose.yaml publishes this as port 80 and the next two as 443.
        listen 8080 default_server;

        return 301 https://psells.localhost$request_uri;
    }

    # HTTPS for any name other than psells.localhost. Asked for in the
    # handshake, it is refused before a certificate is sent. Claimed only in
    # the Host header, after a handshake for psells.localhost, it still lands
    # here, because nginx picks the server for each request by its Host, and
    # is answered 421 Misdirected Request; without that return nginx would
    # serve its own welcome page. Either way nothing answers for another name,
    # which is what stops DNS rebinding: a hostile site pointing its own name
    # at 127.0.0.1 so the browser reads these pages as if they were its own.
    server {
        listen 8443 ssl default_server;

        ssl_reject_handshake on;

        return 421;
    }

    server {
        listen 8443 ssl;
        server_name psells.localhost;

        # From make-certificate.sh, mounted read-only from data/tls/. The key
        # never leaves this machine and is in no image.
        ssl_certificate     /etc/nginx/tls/psells.localhost.crt;
        ssl_certificate_key /etc/nginx/tls/psells.localhost.key;

        # Headers on every response from PSells, errors included ("always";
        # without it nginx adds them to successful responses only). They are
        # all here, in the server, and none in a location: nginx drops every
        # add_header of a server from a location that has one of its own.

        # Only HTTPS for psells.localhost, remembered for a year after one
        # visit, so a browser never tries plain HTTP for it again. Not for
        # other names under it, and not on any preload list. Sending
        # max-age=0 over HTTPS undoes it.
        add_header Strict-Transport-Security "max-age=31536000" always;

        # What a page may load and do. PSells uses no scripts at all, and
        # "default-src 'none'" forbids them along with everything else not
        # named after it. The one style block in templates/base.html is
        # allowed by the hash of its exact text, so an injected <style> or
        # <script> is not; tests/test_container.py fails if the template's
        # block and this hash drift apart. Forms may post only to PSells, no
        # other site may show PSells in a frame, and <base> cannot move where
        # relative links point.
        add_header Content-Security-Policy "default-src 'none'; style-src 'sha256-1O9CH9SEwweG/kBADbFNL2HYF0qTl//26tETZCMTiJY='; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

        # The browser uses the content type it is given and never guesses one.
        add_header X-Content-Type-Options "nosniff" always;

        # Addresses within PSells are not sent to another site when a link
        # leaves it.
        add_header Referrer-Policy "same-origin" always;

        location / {
            # "app" is the app service's name, which Compose's network
            # resolves to its container; 8000 is where uvicorn listens.
            proxy_pass http://app:8000;

            # The Host the browser sent, as it sent it. uvicorn takes the host
            # from this header and never from X-Forwarded-Host, and the
            # cross-site check compares it with the Origin header, port and
            # all. $host would drop a port, which on any port but 443 would
            # make every write from a browser that sends Origin without
            # Sec-Fetch-Site look like it came from another site.
            proxy_set_header Host $http_host;

            # How the browser reached nginx: https here. uvicorn believes this
            # from nginx's address only (FORWARDED_ALLOW_IPS in compose.yaml),
            # and setting it here replaces anything the client sent under the
            # same name.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Who connected to nginx, as nginx saw it. Set rather than appended
            # to ($proxy_add_x_forwarded_for), because nginx is the first hop:
            # anything already in the header came from the client and would let
            # it choose the address the app records.
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
